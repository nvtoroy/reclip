# Ingress for ReClip — https://d.cegth.cc:8900
#
# Upstreams are resolved lazily through Docker's embedded DNS rather than
# declared in an upstream{} block. nginx resolves those names once, at config
# parse time, so if reclip-app is not up yet — both containers start together
# after a reboot — nginx exits with "host not found in upstream" and restart
# loops. The same pattern is already proven by davinci-assist-ingress here.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# The single shared token is the only credential in front of a service that
# fetches arbitrary URLs, and /login has no lockout of its own, so bound the
# guessing rate here.
limit_req_zone $binary_remote_addr zone=reclip_login:1m rate=6r/m;

# Anything arriving on this port without the right hostname — scanners walking
# the IP, and the Certificate Transparency logs publish d.cegth.cc within
# minutes of issuance — gets the connection dropped rather than the app.
server {
    listen 8900 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/d.cegth.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/d.cegth.cc/privkey.pem;

    return 444;
}

server {
    listen 8900 ssl;
    http2 on;
    server_name d.cegth.cc;

    ssl_certificate     /etc/letsencrypt/live/d.cegth.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/d.cegth.cc/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # TLS stops here, so the app sees plain HTTP and sets its auth cookie
    # without the Secure flag. Stamping the flag on in the proxy keeps that
    # correct without the app having to trust a forwarded header.
    proxy_cookie_flags reclip_token secure httponly samesite=lax;

    # Finished downloads are streamed straight through. Left on, nginx would
    # spool every served file to /var/cache/nginx first — a second full copy of
    # each file, on the same disk as the rs databases.
    proxy_buffering off;
    proxy_max_temp_file_size 0;

    # Only JSON with a URL is ever posted here.
    client_max_body_size 1m;

    # A 289 MB download from a throttled source took over 8 minutes end to end,
    # and /api/spotify can run longer still on a large playlist.
    proxy_connect_timeout 15s;
    proxy_send_timeout    1h;
    proxy_read_timeout    1h;

    location = /login {
        limit_req zone=reclip_login burst=3 nodelay;
        set $reclip_app "http://app:8899";
        proxy_pass $reclip_app$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The UI polls this once per second per card; logging it buries everything
    # else and fills the log file for no benefit.
    location ~ ^/api/status/ {
        access_log off;
        set $reclip_app "http://app:8899";
        proxy_pass $reclip_app$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $reclip_app "http://app:8899";
        proxy_pass $reclip_app$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
