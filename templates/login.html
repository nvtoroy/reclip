<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReClip — Sign In</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f1eb;
      --fg: #3a3a38;
      --accent: #e85d2a;
      --accent-hover: #d04e1f;
      --muted: #9c9889;
      --card: #fff;
      --card-border: #e2ded6;
      --error: #c43d3d;
      --radius: 14px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Mono', monospace;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-box { width: 100%; max-width: 380px; }

    .brand { margin-bottom: 32px; text-align: center; }
    .brand h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 3rem;
      font-weight: 400;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .brand h1 em { font-style: italic; color: var(--accent); }
    .brand p {
      margin-top: 10px;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    input[type="password"] {
      width: 100%;
      padding: 14px 18px;
      border: 1.5px solid var(--card-border);
      border-radius: var(--radius);
      background: var(--card);
      color: var(--fg);
      font-family: 'DM Mono', monospace;
      font-size: 0.88rem;
      outline: none;
      margin-bottom: 10px;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    input[type="password"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(232, 93, 42, 0.08);
    }
    input::placeholder { color: var(--muted); }

    button {
      width: 100%;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-family: 'DM Mono', monospace;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    button:hover { background: var(--accent-hover); }
    button:active { transform: scale(0.98); }

    .error {
      margin-top: 14px;
      font-size: 0.72rem;
      color: var(--error);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="brand">
      <h1>Re<em>Clip</em></h1>
      <p>Enter access token to continue</p>
    </div>
    <form method="POST" action="/login">
      <input type="password" name="token" placeholder="Access token" autofocus autocomplete="current-password">
      <button type="submit">Sign In</button>
    </form>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
  </div>
</body>
</html>
